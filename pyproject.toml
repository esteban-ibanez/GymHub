[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E: errores de estilo, F: errores de pyflakes (imports sin usar, variables sin definir...),
# I: orden de los imports, W: avisos de estilo.
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
# Los tests viven dentro de cada módulo (app/features/<modulo>/tests/) y en app/tests/.
testpaths = ["app"]
